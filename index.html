<script>
// localStorage shim to match artifact storage API
window.storage = {
  get: function(key) {
    return new Promise(function(resolve, reject) {
      var val = localStorage.getItem(key);
      if (val === null) reject(new Error("Key not found: " + key));
      else resolve({ key: key, value: val });
    });
  },
  set: function(key, value) {
    return new Promise(function(resolve) {
      localStorage.setItem(key, value);
      resolve({ key: key, value: value });
    });
  },
  delete: function(key) {
    return new Promise(function(resolve) {
      localStorage.removeItem(key);
      resolve({ key: key, deleted: true });
    });
  }
};
// Show error div if React doesn't render within 10s

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useCallback } = React;


const STORAGE_KEY = "skill-tree-data-v2";
const ICONS = ["🎨","🎸","🍳","📷","✏️","🎮","🏋️","🧪","🎵","📚","💻","🪴","🎭","🧵","🔧","🎯","🏔️","🧘","♟️","🎹"];
const CATS = ["lesson","supply","course","other"];
const CAT_META = { lesson: { icon: "📖", color: "#5b9eff", label: "Lesson" }, supply: { icon: "🛒", color: "#e8a33a", label: "Supply" }, course: { icon: "🎓", color: "#b47eff", label: "Course" }, other: { icon: "📌", color: "#8a8294", label: "Other" } };

const defaultData = { skills: [], history: [] };
function uid() { return Math.random().toString(36).slice(2, 10); }

/* ─── URL Intelligence ─── */
const SUPPLY_DOMAINS = ["amazon","sweetwater","reverb","bhphoto","adorama","dickblick","etsy","ebay","walmart","target","homedepot","michaels","joann"];
const COURSE_DOMAINS = ["udemy","skillshare","coursera","masterclass","domestika","linkedin","edx","codecademy","brilliant","khan","pluralsight","treehouse"];
const LESSON_DOMAINS = ["youtube","youtu.be","vimeo","twitch"];

function guessCategory(url) {
  try {
    const host = new URL(url).hostname.toLowerCase().replace("www.","");
    if (LESSON_DOMAINS.some(d => host.includes(d))) return "lesson";
    if (SUPPLY_DOMAINS.some(d => host.includes(d))) return "supply";
    if (COURSE_DOMAINS.some(d => host.includes(d))) return "course";
  } catch {}
  return "other";
}

function extractKeywords(text) {
  return text.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w => w.length > 3);
}

function guessBranch(title, branches) {
  if (!title || !branches.length) return null;
  const lt = title.toLowerCase();
  let best = null, bestScore = 0;
  for (const br of branches) {
    const words = br.name.toLowerCase().split(/\s+/);
    let score = 0;
    for (const w of words) { if (w.length > 2 && lt.includes(w)) score += w.length; }
    if (score > bestScore) { bestScore = score; best = br.id; }
  }
  return bestScore >= 4 ? best : null;
}

async function fetchMeta(url) {
  let title = "", author = "";
  const host = new URL(url).hostname.toLowerCase();
  const isYT = host.includes("youtube") || host.includes("youtu.be");

  if (isYT || host.includes("vimeo")) {
    // Strategy 1: YouTube's own oEmbed (most reliable CORS support)
    if (isYT) {
      try {
        const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
        if (r.ok) { const d = await r.json(); title = d.title || ""; author = d.author_name || ""; }
      } catch {}
    }
    // Strategy 2: noembed (works for YouTube + Vimeo)
    if (!title) {
      try {
        const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
        if (r.ok) { const d = await r.json(); title = d.title || ""; author = d.author_name || ""; }
      } catch {}
    }
    // Strategy 3: YouTube page fetch — look for title in HTML
    if (!title && isYT) {
      try {
        const r = await fetch(url, { redirect: "follow" });
        if (r.ok) {
          const html = await r.text();
          const m = html.match(/<title[^>]*>([^<]+)<\/title>/i);
          if (m && m[1]) {
            title = m[1].replace(/ - YouTube$/i, "").trim();
          }
        }
      } catch {}
    }
  }

  // Fallback: extract from URL intelligently
  if (!title) {
    try {
      const u = new URL(url);
      if (isYT) {
        // for YouTube, grab video ID or playlist ID rather than "watch"
        const vid = u.searchParams.get("v");
        const list = u.searchParams.get("list");
        const pathId = u.pathname.split("/").filter(Boolean).pop();
        if (host.includes("youtu.be") && pathId && pathId !== "watch") {
          title = `YouTube video (${pathId})`;
        } else if (vid) {
          title = `YouTube video (${vid})`;
        } else if (list) {
          title = `YouTube playlist (${list.slice(0, 12)}…)`;
        } else {
          title = `YouTube link`;
        }
      } else {
        // general URL: take last path segment, clean it up
        const slug = u.pathname.split("/").filter(Boolean).pop() || "";
        title = slug.replace(/[-_+]/g, " ").replace(/\.[^.]+$/, "").replace(/%20/g, " ").slice(0, 80);
        if (!title || title.length < 3) title = u.hostname.replace("www.", "");
      }
    } catch { title = url; }
  }

  return { title, author };
}

// keep simple version for per-skill upload
async function fetchTitle(url) {
  const m = await fetchMeta(url);
  return m.title;
}

async function processLinks(rawText, branches) {
  const urls = rawText.split("\n").map(l => l.trim()).filter(l => /^https?:\/\//.test(l));
  const items = [];
  for (const url of urls) {
    const title = await fetchTitle(url);
    const category = guessCategory(url);
    const branchId = guessBranch(title, branches);
    items.push({ id: uid(), url, title, category, branchId, destination: "resource" });
  }
  return items;
}

const FILLER = /\b(tutorial|lesson|lessons|how to|beginner|beginners|advanced|intermediate|basics|basic|introduction|intro|guide|tips|tricks|learn|learning|step by step|easy|simple|complete|full|free|official|video|episode|part|vol|chapter|\d{4}|#\d+|ep\s*\d+|pt\s*\d+)\b/gi;
const DELIMITERS = /\s*[-–—|:·•]\s*/;

function cleanPhrase(s) {
  return s.replace(FILLER, " ").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "").replace(/^[\d\s.#]+/, "").replace(/[\d\s.#]+$/, "").trim();
}

function titleCase(s) {
  return s.replace(/\b\w/g, c => c.toUpperCase());
}

function extractSkillAndBranch(title, author) {
  // split title by delimiters
  const parts = title.split(DELIMITERS).map(cleanPhrase).filter(p => p.length > 1);

  let sugSkill = "", sugBranch = "";

  if (parts.length >= 2) {
    // first meaningful part is usually the broad topic, second is the subtopic
    sugSkill = parts[0];
    sugBranch = parts[1];
  } else if (parts.length === 1) {
    // try to split by spaces and take first 2-3 words as skill
    const words = parts[0].split(/\s+/);
    if (words.length >= 4) {
      sugSkill = words.slice(0, 2).join(" ");
      sugBranch = words.slice(2).join(" ");
    } else {
      sugSkill = parts[0];
    }
  }

  // if author is available and sugSkill is weak, use author context
  if (author && (!sugSkill || sugSkill.length < 3)) {
    sugSkill = cleanPhrase(author);
  }

  // clean up and title-case
  sugSkill = titleCase(cleanPhrase(sugSkill)).slice(0, 40);
  sugBranch = titleCase(cleanPhrase(sugBranch)).slice(0, 40);

  return { sugSkill, sugBranch };
}

function clusterSkillNames(items) {
  // group items by similar suggested skill names and normalize to the most common variant
  const groups = {};
  items.forEach(it => {
    if (it.skillId || !it.newSkillName) return;
    const key = it.newSkillName.toLowerCase().trim();
    if (!key) return;
    if (!groups[key]) groups[key] = { canonical: it.newSkillName, count: 0 };
    groups[key].count++;
  });

  // for each item, find best matching group (substring match)
  items.forEach(it => {
    if (it.skillId || !it.newSkillName) return;
    const key = it.newSkillName.toLowerCase().trim();
    if (!key) return;

    // check if this key is a substring of a more popular group, or vice versa
    let bestGroup = key;
    let bestCount = groups[key]?.count || 0;
    for (const [gk, gv] of Object.entries(groups)) {
      if (gk === key) continue;
      if ((gk.includes(key) || key.includes(gk)) && gv.count > bestCount) {
        bestGroup = gk; bestCount = gv.count;
      }
    }
    if (bestGroup !== key && groups[bestGroup]) {
      it.newSkillName = groups[bestGroup].canonical;
    }
  });
}

async function processLinksGlobal(rawText, skills) {
  const urls = rawText.split("\n").map(l => l.trim()).filter(l => /^https?:\/\//.test(l));
  const items = [];

  for (const url of urls) {
    const { title, author } = await fetchMeta(url);
    const category = guessCategory(url);

    // try matching to existing skills/branches
    let bestSkillId = null, bestBranchId = null, bestScore = 0;
    const lt = title.toLowerCase();
    for (const sk of skills) {
      const skWords = sk.name.toLowerCase().split(/\s+/);
      let skScore = 0;
      for (const w of skWords) { if (w.length > 2 && lt.includes(w)) skScore += w.length * 2; }
      for (const br of sk.branches) {
        const brWords = br.name.toLowerCase().split(/\s+/);
        let brScore = skScore;
        for (const w of brWords) { if (w.length > 2 && lt.includes(w)) brScore += w.length; }
        if (brScore > bestScore) { bestScore = brScore; bestSkillId = sk.id; bestBranchId = br.id; }
      }
      if (skScore > bestScore) { bestScore = skScore; bestSkillId = sk.id; bestBranchId = null; }
    }

    if (bestScore >= 4) {
      items.push({ id: uid(), url, title, category, destination: "resource", skillId: bestSkillId, branchId: bestBranchId, newSkillName: "", newBranchName: "" });
    } else {
      // extract suggestions from metadata
      const { sugSkill, sugBranch } = extractSkillAndBranch(title, author);
      items.push({ id: uid(), url, title, category, destination: "resource", skillId: null, branchId: null, newSkillName: sugSkill, newBranchName: sugBranch });
    }
  }

  // cluster similar skill name suggestions
  clusterSkillNames(items);

  return items;
}

/* ─── Wikipedia Discovery ─── */
const WIKI_API = "https://en.wikipedia.org/w/api.php";
async function wikiSearch(q) {
  const r = await fetch(`${WIKI_API}?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=3&format=json&origin=*`);
  const d = await r.json(); return d.query?.search?.map(s => s.title) || [];
}
async function wikiLinks(title) {
  try {
    const r = await fetch(`${WIKI_API}?action=parse&page=${encodeURIComponent(title)}&prop=sections|links|categories&format=json&origin=*`);
    const d = await r.json(); if (d.error) return { links:[], categories:[], sections:[] };
    const skip = ["Wikipedia:","Help:","Template:","Category:","Portal:","File:","Talk:","User:","Special:","Module:","Draft:"];
    const links = (d.parse?.links||[]).filter(l=>l.ns===0&&l.exists!==undefined).map(l=>l["*"]).filter(t=>!skip.some(p=>t.startsWith(p)));
    const categories = (d.parse?.categories||[]).map(c=>c["*"]?.replace(/_/g," ")).filter(c=>c&&!c.includes("Articles")&&!c.includes("pages")&&!c.includes("Wikipedia")&&!c.includes("CS1")&&!c.includes("short description")&&!c.includes("Use ")&&!c.includes("All ")&&!c.includes("Webarchive")&&c.length<60);
    const skipSec = ["see also","references","external links","notes","further reading","bibliography","footnotes","gallery","sources"];
    const sections = (d.parse?.sections||[]).filter(s=>s.toclevel<=2&&!skipSec.includes(s.line?.toLowerCase())).map(s=>s.line).filter(s=>s&&s.length>2&&s.length<50);
    return { links, categories, sections };
  } catch { return { links:[], categories:[], sections:[] }; }
}
async function wikiCatMembers(cat, n=15) {
  try { const r=await fetch(`${WIKI_API}?action=query&list=categorymembers&cmtitle=Category:${encodeURIComponent(cat)}&cmlimit=${n}&cmtype=page&format=json&origin=*`); const d=await r.json(); return (d.query?.categorymembers||[]).map(m=>m.title); } catch { return []; }
}
async function discoverRelated(skillName, branchNames, existingUrls) {
  const urlKw = existingUrls.map(u=>{ try { return new URL(u).pathname.split(/[/\-_]/).filter(s=>s.length>3&&!/\d{4,}/.test(s)); } catch{return[];} }).flat().map(s=>s.replace(/[^a-zA-Z]/g,"").toLowerCase()).filter(s=>s.length>3);
  const terms = [skillName,...branchNames.slice(0,4)]; if(urlKw.length) terms.push(`${skillName} ${[...new Set(urlKw)].slice(0,2).join(" ")}`);
  const seen=new Set(), sugs=new Map();
  for(const term of terms){ const titles=await wikiSearch(term); for(const t of titles){ if(seen.has(t))continue; seen.add(t); const{links,categories,sections}=await wikiLinks(t);
    sections.forEach(sec=>{ if(!sugs.has(sec)&&!branchNames.some(b=>b.toLowerCase()===sec.toLowerCase())&&sec.toLowerCase()!==skillName.toLowerCase()) sugs.set(sec,{source:`${t} (section)`,wikiUrl:`https://en.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g,"_"))}#${encodeURIComponent(sec.replace(/ /g,"_"))}`,fromSection:true}); });
    links.slice(0,30).forEach(l=>{ if(!sugs.has(l)&&!branchNames.some(b=>b.toLowerCase()===l.toLowerCase())&&l.toLowerCase()!==skillName.toLowerCase()) sugs.set(l,{source:t,wikiUrl:`https://en.wikipedia.org/wiki/${encodeURIComponent(l.replace(/ /g,"_"))}`,fromSection:false}); });
    for(const cat of categories.slice(0,2)){ const ms=await wikiCatMembers(cat,10); ms.forEach(m=>{ if(!sugs.has(m)&&!branchNames.some(b=>b.toLowerCase()===m.toLowerCase())&&m.toLowerCase()!==skillName.toLowerCase()) sugs.set(m,{source:`Category: ${cat}`,wikiUrl:`https://en.wikipedia.org/wiki/${encodeURIComponent(m.replace(/ /g,"_"))}`,fromSection:false}); }); }
  }}
  const ls=skillName.toLowerCase(), lb=branchNames.map(b=>b.toLowerCase());
  const scored=[...sugs.entries()].map(([title,meta])=>{ let sc=0; const lt=title.toLowerCase(); if(meta.fromSection)sc+=5; if(lt.includes(ls)||ls.includes(lt))sc+=3; if(lb.some(b=>lt.includes(b)||b.includes(lt)))sc+=2; if(title.length<30)sc+=1; if(title.length>60)sc-=2; if(/\d{4}/.test(title))sc-=3; if(/^List of/.test(title))sc-=3; return{title,...meta,sc}; });
  scored.sort((a,b)=>b.sc-a.sc); return scored.slice(0,25);
}

/* ─── Components ─── */
function Modal({open,onClose,title,children}) {
  if(!open) return null;
  return (<div style={s.overlay} onClick={onClose}><div style={s.modal} onClick={e=>e.stopPropagation()}><div style={s.modalHead}><span style={s.modalTitle}>{title}</span><button style={s.modalX} onClick={onClose}>✕</button></div>{children}</div></div>);
}
function UnlockReveal({item,milestone,onClose}) {
  if(!item) return null;
  const tc={tutorial:"#5b9eff",challenge:"#e8a33a",reward:"#5be0a0"}, tl={tutorial:"📖 TUTORIAL",challenge:"⚔️ CHALLENGE",reward:"🏆 REWARD"};
  return (<div style={s.overlay} onClick={onClose}><div style={{...s.modal,textAlign:"center",maxWidth:420,animation:"popIn 0.4s cubic-bezier(.2,1.2,.4,1)"}} onClick={e=>e.stopPropagation()}>
    {milestone&&<div style={{fontSize:13,color:"#e8a33a",marginBottom:8,fontWeight:700,letterSpacing:2}}>🎯 MILESTONE {milestone} REACHED!</div>}
    <div style={{fontSize:11,letterSpacing:4,color:"#8a8294",marginBottom:8}}>YOU UNLOCKED</div>
    <div style={{display:"inline-block",padding:"4px 14px",borderRadius:20,fontSize:11,fontWeight:700,letterSpacing:2,color:tc[item.type]||"#aaa",background:`${tc[item.type]||"#aaa"}18`,marginBottom:16}}>{tl[item.type]||item.type?.toUpperCase()}</div>
    <div style={{fontSize:20,fontWeight:700,color:"#f0e6d3",marginBottom:12,lineHeight:1.4}}>{item.title}</div>
    {item.url&&<a href={item.url} target="_blank" rel="noopener noreferrer" style={{fontSize:13,color:"#5b9eff",wordBreak:"break-all",display:"block",marginBottom:16}}>{item.url}</a>}
    {item.description&&<div style={{fontSize:13,color:"#8a8294",lineHeight:1.6,marginBottom:16}}>{item.description}</div>}
    <button style={s.primaryBtn} onClick={onClose}>Nice! →</button>
  </div></div>);
}
function MilestoneBar({current,target,milestones,hitMilestones}) {
  const pct=target>0?Math.min((current/target)*100,100):0;
  return (<div style={{position:"relative",marginTop:8,marginBottom:4}}>
    <div style={s.milestoneTrack}><div style={{...s.milestoneFill,width:`${pct}%`}}/></div>
    {milestones.map(m=>{const mp=target>0?(m/target)*100:0; const hit=hitMilestones?.includes(m); return(
      <div key={m} style={{position:"absolute",left:`${mp}%`,top:-2,transform:"translateX(-50%)"}}>
        <div style={{width:12,height:12,borderRadius:"50%",background:hit?"#e8a33a":current>=m?"#5be0a0":"#2a2530",border:`2px solid ${hit?"#e8a33a":current>=m?"#5be0a0":"#3d3648"}`,transition:"all 0.3s"}}/>
        <div style={{fontSize:9,color:current>=m?"#a9a1b4":"#4a4454",textAlign:"center",marginTop:2,whiteSpace:"nowrap"}}>{m}</div>
      </div>);})}
    <div style={{display:"flex",justifyContent:"space-between",marginTop:14}}><span style={{fontSize:11,color:"#6b6476"}}>{current}/{target}</span><span style={{fontSize:11,color:"#6b6476"}}>{Math.round(pct)}%</span></div>
  </div>);
}

/* ════════════ MAIN APP ════════════ */
function SkillTree() {
  const [data,setData]=useState(defaultData);
  const [loaded,setLoaded]=useState(false);
  const [view,setView]=useState("home");
  const [activeSkillId,setActiveSkillId]=useState(null);
  const [skillTab,setSkillTab]=useState("branches"); // branches | resources
  const [modal,setModal]=useState(null);
  const [revealItem,setRevealItem]=useState(null);
  const [revealMilestone,setRevealMilestone]=useState(null);
  const [pendingDelete,setPendingDelete]=useState(null);
  // forms
  const [fName,setFName]=useState(""); const [fIcon,setFIcon]=useState("🎨");
  const [fBranchName,setFBranchName]=useState("");
  const [fUnlockTitle,setFUnlockTitle]=useState(""); const [fUnlockType,setFUnlockType]=useState("tutorial");
  const [fUnlockUrl,setFUnlockUrl]=useState(""); const [fUnlockDesc,setFUnlockDesc]=useState("");
  const [fBranchTarget,setFBranchTarget]=useState("");
  const [fProjectName,setFProjectName]=useState(""); const [fProjectBranch,setFProjectBranch]=useState("");
  const [bulkText,setBulkText]=useState("");
  const [fOngoingName,setFOngoingName]=useState(""); const [fOngoingTarget,setFOngoingTarget]=useState("");
  const [fOngoingMilestones,setFOngoingMilestones]=useState(""); const [fOngoingBranch,setFOngoingBranch]=useState("");
  const [fIncrementAmt,setFIncrementAmt]=useState("1"); const [fIncrementProjectId,setFIncrementProjectId]=useState("");
  // discovery
  const [discoveries,setDiscoveries]=useState([]); const [discovering,setDiscovering]=useState(false);
  const [selectedDiscoveries,setSelectedDiscoveries]=useState(new Set());
  // smart upload
  const [smartUploadText,setSmartUploadText]=useState("");
  const [smartItems,setSmartItems]=useState([]); const [processing,setProcessing]=useState(false);
  const [resourceFilter,setResourceFilter]=useState("all");
  // global upload
  const [globalUploadText,setGlobalUploadText]=useState("");
  const [globalItems,setGlobalItems]=useState([]); const [globalProcessing,setGlobalProcessing]=useState(false);

  const save=useCallback(async(d)=>{try{await window.storage.set(STORAGE_KEY,JSON.stringify(d))}catch(e){console.error(e)}},[]);
  useEffect(()=>{(async()=>{try{const r=await window.storage.get(STORAGE_KEY);if(r?.value)setData(JSON.parse(r.value))}catch(e){}setLoaded(true)})()},[]);
  const update=(fn)=>{setData(prev=>{const next=fn(JSON.parse(JSON.stringify(prev)));save(next);return next})};

  const activeSkill=data.skills.find(sk=>sk.id===activeSkillId);
  const totalUnlocked=sk=>sk.branches.reduce((a,b)=>a+b.unlocks.filter(u=>u.unlocked).length,0);
  const totalUnlocks=sk=>sk.branches.reduce((a,b)=>a+b.unlocks.length,0);
  const totalProjects=sk=>{let c=sk.branches.reduce((a,b)=>a+(b.completedCount||0),0);sk.branches.forEach(br=>(br.ongoingProjects||[]).forEach(op=>{c+=op.current||0}));return c};

  const doRandomUnlock=(d,skId,brId,entry)=>{
    const sk=d.skills.find(x=>x.id===skId),br=sk?.branches.find(x=>x.id===brId);if(!br)return null;
    const locked=br.unlocks.filter(u=>!u.unlocked);if(!locked.length)return null;
    const pick=locked[Math.floor(Math.random()*locked.length)];const real=br.unlocks.find(u=>u.id===pick.id);
    if(real){real.unlocked=true;if(entry)entry.unlockedItem={...real};return{...real}}return null;
  };

  // ── skill actions ──
  const addSkill=()=>{if(!fName.trim())return;update(d=>{d.skills.push({id:uid(),name:fName.trim(),icon:fIcon,branches:[],resources:[]});return d});setFName("");setFIcon("🎨");setModal(null)};
  const addBranch=()=>{if(!fBranchName.trim()||!activeSkillId)return;update(d=>{const sk=d.skills.find(x=>x.id===activeSkillId);if(sk)sk.branches.push({id:uid(),name:fBranchName.trim(),unlocks:[],completedCount:0,ongoingProjects:[]});return d});setFBranchName("");setModal(null)};

  const addOngoingProject=()=>{if(!fOngoingName.trim()||!fOngoingTarget||!fOngoingBranch)return;const target=parseInt(fOngoingTarget);if(isNaN(target)||target<1)return;const milestones=fOngoingMilestones.split(",").map(x=>parseInt(x.trim())).filter(x=>!isNaN(x)&&x>0&&x<=target).sort((a,b)=>a-b);update(d=>{const sk=d.skills.find(x=>x.id===activeSkillId);const br=sk?.branches.find(x=>x.id===fOngoingBranch);if(br){if(!br.ongoingProjects)br.ongoingProjects=[];br.ongoingProjects.push({id:uid(),name:fOngoingName.trim(),target,current:0,milestones,hitMilestones:[]})}return d});setFOngoingName("");setFOngoingTarget("");setFOngoingMilestones("");setFOngoingBranch("");setModal(null)};

  const incrementOngoing=(branchId,projectId,amount)=>{let unlocked=null,hitMs=null;update(d=>{const sk=d.skills.find(x=>x.id===activeSkillId);const br=sk?.branches.find(x=>x.id===branchId);const op=br?.ongoingProjects?.find(x=>x.id===projectId);if(!op)return d;const old=op.current;op.current=Math.min(op.current+amount,op.target);const newlyHit=op.milestones.filter(m=>m>old&&m<=op.current&&!op.hitMilestones.includes(m));newlyHit.forEach(m=>{op.hitMilestones.push(m);const entry={id:uid(),date:new Date().toISOString(),skillName:sk.name,branchName:br.name,projectName:`${op.name} — milestone ${m}/${op.target}`,type:"milestone"};const u=doRandomUnlock(d,activeSkillId,branchId,entry);if(u&&!unlocked){unlocked=u;hitMs=m}d.history.unshift(entry)});if(op.current>=op.target&&old<op.target){const entry={id:uid(),date:new Date().toISOString(),skillName:sk.name,branchName:br.name,projectName:`${op.name} — COMPLETED!`,type:"completion"};if(!unlocked){const u=doRandomUnlock(d,activeSkillId,branchId,entry);if(u){unlocked=u;hitMs=op.target}}d.history.unshift(entry)}return d});if(unlocked)setTimeout(()=>{setRevealItem(unlocked);setRevealMilestone(hitMs)},200)};

  // ── deletes ──
  const deleteSkill=id=>{update(d=>{d.skills=d.skills.filter(x=>x.id!==id);return d});if(activeSkillId===id){setActiveSkillId(null);setView("home")}};

  const deleteOngoing=(brId,opId)=>{update(d=>{const sk=d.skills.find(x=>x.id===activeSkillId);const br=sk?.branches.find(x=>x.id===brId);if(br)br.ongoingProjects=(br.ongoingProjects||[]).filter(x=>x.id!==opId);return d})};

  // ── smart upload ──
  const runSmartUpload=async()=>{if(!smartUploadText.trim()||!activeSkill)return;setProcessing(true);setSmartItems([]);const items=await processLinks(smartUploadText,activeSkill.branches);setSmartItems(items);setProcessing(false)};
  const updateSmartItem=(id,field,value)=>{setSmartItems(prev=>prev.map(it=>it.id===id?{...it,[field]:value}:it))};
  const commitSmartUpload=()=>{if(!smartItems.length)return;update(d=>{const sk=d.skills.find(x=>x.id===activeSkillId);if(!sk)return d;if(!sk.resources)sk.resources=[];smartItems.forEach(it=>{if(it.destination==="resource"){sk.resources.push({id:uid(),title:it.title,url:it.url,category:it.category,branchId:it.branchId})}else if(it.destination==="unlock"&&it.branchId){const br=sk.branches.find(b=>b.id===it.branchId);if(br)br.unlocks.push({id:uid(),title:it.title,type:it.category==="lesson"?"tutorial":it.category==="course"?"tutorial":"reward",url:it.url,description:null,unlocked:false})}});return d});setSmartItems([]);setSmartUploadText("");setModal(null)};

  if(!loaded) return (<div style={s.wrapper}><div style={{color:"#5c5466"}}>Loading…</div></div>);

            <div style={{fontSize:11,color:"#6b6476",marginTop:4}}>{sk.branches.length} branch{sk.branches.length!==1?"es":""} · {projects} logged{res>0?` · ${res} resources`:""}</div>
            <div style={s.progressTrack}><div style={{...s.progressFill,width:`${pct}%`}}/></div>
            <div style={{fontSize:11,color:"#8a8294",marginTop:6}}>{unlocked}/{total} unlocked</div>

          {data.history.slice(0,8).map(h=>(<div key={h.id} style={s.historyRow}><div style={{...s.historyDot,background:h.type==="milestone"?"#e8a33a":h.type==="completion"?"#5be0a0":"#e85d3a"}}/><div style={{flex:1}}><div style={{fontSize:13,color:"#c8c0d4"}}><strong>{h.projectName}</strong> <span style={{color:"#6b6476"}}>in</span> {h.skillName} → {h.branchName}</div>{h.unlockedItem&&<div style={{fontSize:12,color:"#e8a33a",marginTop:2}}>🔓 Unlocked: {h.unlockedItem.title}</div>}<div style={{fontSize:11,color:"#4a4454",marginTop:2}}>{new Date(h.date).toLocaleDateString()}</div></div><button style={s.dangerBtnTiny} onClick={()=>deleteHistoryItem(h.id)}>✕</button></div>))}

                        <button onClick={() => updateGlobalItem(it.id,"destination","unlock")} style={{padding:"3px 8px",borderRadius:5,border:"none",fontSize:10,cursor:"pointer",outline:"none",background:it.destination==="unlock"?"rgba(232,163,58,0.15)":"rgba(255,255,255,0.04)",color:it.destination==="unlock"?"#e8a33a":"#6b6476",opacity:hasBranch?1:0.4}} disabled={!hasBranch}>🔒 Unlock</button>
                      </div>
                    )}

                    {!hasSkill && <div style={{fontSize:10,color:"#4a4454",fontStyle:"italic"}}>No skill assigned — will be skipped</div>}
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button style={{...s.smallBtn,flex:1}} onClick={() => setGlobalItems([])}>← Back</button>
              <button style={{...s.primaryBtn,flex:2}} onClick={commitGlobalUpload}>
                Save {globalItems.filter(it => it.skillId || it.newSkillName?.trim()).length} Links
              </button>
            </div>
          </div>
        )}
      </Modal>

      <ConfirmModal/>
    </div>
  )}

  /* ════════════ SKILL DETAIL ════════════ */
  if(view==="skill"&&activeSkill){
    const resources=activeSkill.resources||[];
    const filteredRes=resourceFilter==="all"?resources:resources.filter(r=>r.category===resourceFilter);
    return(
    <div style={s.wrapper}><style>{keyframes}</style><div style={s.grain}/>
      <UnlockReveal item={revealItem} milestone={revealMilestone} onClose={()=>{setRevealItem(null);setRevealMilestone(null)}}/>
      <div style={s.topBar}><button style={s.backBtn} onClick={()=>{setView("home");setActiveSkillId(null)}}>← Back</button><button style={s.dangerBtnSmall} onClick={()=>setPendingDelete({type:"skill",id:activeSkill.id,label:activeSkill.name})}>Delete Skill</button></div>
      <header style={{...s.header,marginBottom:12}}><div style={{fontSize:36}}>{activeSkill.icon}</div><h1 style={{...s.mainTitle,fontSize:22}}>{activeSkill.name.toUpperCase()}</h1></header>

      {/* Tab switcher */}
      <div style={{display:"flex",gap:4,marginBottom:20,background:"rgba(255,255,255,0.04)",borderRadius:10,padding:4,maxWidth:520,width:"100%"}}>
        {[["branches","🌿 Branches"],["resources","📦 Resources"]].map(([key,label])=>(
          <button key={key} onClick={()=>setSkillTab(key)} style={{flex:1,padding:"10px 16px",borderRadius:8,border:"none",fontSize:13,fontWeight:600,cursor:"pointer",outline:"none",WebkitTapHighlightColor:"transparent",background:skillTab===key?"rgba(232,93,58,0.2)":"transparent",color:skillTab===key?"#e85d3a":"#6b6476"}}>{label}</button>
        ))}
      </div>

      {/* ── BRANCHES TAB ── */}
      {skillTab==="branches"&&(<>
        {activeSkill.branches.length>0&&(
          <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",justifyContent:"center",maxWidth:520,width:"100%"}}>
            <button style={{...s.primaryBtn,flex:1,minWidth:100}} onClick={()=>{setFProjectBranch(activeSkill.branches[0]?.id||"");setModal("logOneOff")}}>✦ Log Project</button>
            <button style={{...s.secondaryBtn,flex:1,minWidth:100}} onClick={()=>{setFOngoingBranch(activeSkill.branches[0]?.id||"");setModal("addOngoing")}}>🔄 Ongoing</button>
            <button style={{...s.discoverBtn,flex:1,minWidth:100}} onClick={runDiscover} disabled={discovering}>🔍 Discover</button>
          </div>)}
        {activeSkill.branches.length===0&&(<div style={{marginBottom:12,display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}><button style={s.discoverBtn} onClick={runDiscover} disabled={discovering}>🔍 Discover Branches</button></div>)}

        {activeSkill.branches.length===0?(
          <div style={s.emptyState}><div style={{color:"#8a8294",fontSize:14,marginBottom:16}}>Add branches to define paths within this skill.</div><button style={s.primaryBtn} onClick={()=>setModal("addBranch")}>+ Add First Branch</button></div>
        ):(
          <div style={{width:"100%",maxWidth:520,display:"flex",flexDirection:"column",gap:16}}>
            {activeSkill.branches.map(br=>{const locked=br.unlocks.filter(u=>!u.unlocked),unlocked=br.unlocks.filter(u=>u.unlocked),pct=br.unlocks.length>0?(unlocked.length/br.unlocks.length)*100:0,ongoings=br.ongoingProjects||[];return(
              <div key={br.id} style={s.branchCard}>
                <div style={s.branchHeader}><div><div style={s.branchName}>{br.name}</div><div style={s.branchMeta}>{br.completedCount||0} one-off · {ongoings.length} ongoing · {unlocked.length}/{br.unlocks.length} unlocked</div></div><button style={s.dangerBtnTiny} onClick={()=>setPendingDelete({type:"branch",id:br.id,label:br.name})}>✕</button></div>
                <div style={s.progressTrack}><div style={{...s.progressFill,width:`${pct}%`,background:"linear-gradient(90deg,#5be0a0,#3ac47d)"}}/></div>
                {ongoings.length>0&&(<div style={{marginTop:14}}><div style={{fontSize:10,letterSpacing:2,color:"#e8a33a",marginBottom:8}}>ONGOING PROJECTS</div>
                  {ongoings.map(op=>(<div key={op.id} style={s.ongoingCard}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:14,fontWeight:600,color:"#e8e4ec"}}>{op.name}</div><button style={s.dangerBtnTiny} onClick={()=>setPendingDelete({type:"ongoing",id:op.id,branchId:br.id,label:op.name})}>✕</button></div>
                    <MilestoneBar current={op.current} target={op.target} milestones={op.milestones} hitMilestones={op.hitMilestones}/>
                    {op.current<op.target&&(<div style={{display:"flex",gap:6,marginTop:8,alignItems:"center"}}>
                      <button style={s.incrBtn} onClick={()=>incrementOngoing(br.id,op.id,1)}>+1</button><button style={s.incrBtn} onClick={()=>incrementOngoing(br.id,op.id,5)}>+5</button><button style={s.incrBtn} onClick={()=>incrementOngoing(br.id,op.id,10)}>+10</button><div style={{flex:1}}/>
                      <input style={{...s.input,width:52,padding:"6px 8px",fontSize:13,textAlign:"center"}} value={fIncrementProjectId===op.id?fIncrementAmt:""} onChange={e=>{setFIncrementProjectId(op.id);setFIncrementAmt(e.target.value)}} placeholder="#" onKeyDown={e=>{if(e.key==="Enter"){const n=parseInt(fIncrementAmt);if(!isNaN(n)&&n>0){incrementOngoing(br.id,op.id,n);setFIncrementAmt("");setFIncrementProjectId("")}}}}/>
                      <button style={s.smallBtn} onClick={()=>{const n=parseInt(fIncrementAmt);if(!isNaN(n)&&n>0){incrementOngoing(br.id,op.id,n);setFIncrementAmt("");setFIncrementProjectId("")}}}>Add</button>
                    </div>)}
                    {op.current>=op.target&&<div style={{marginTop:8,textAlign:"center",fontSize:13,color:"#5be0a0",fontWeight:700,letterSpacing:2}}>✓ COMPLETE</div>}
                  </div>))}</div>)}
                {unlocked.length>0&&(<div style={{marginTop:14}}><div style={{fontSize:10,letterSpacing:2,color:"#5be0a0",marginBottom:6}}>UNLOCKED</div>{unlocked.map(u=>(<div key={u.id} style={s.unlockItem}><span style={{fontSize:14,flexShrink:0}}>{u.type==="tutorial"?"📖":u.type==="challenge"?"⚔️":"🏆"}</span><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,color:"#d8d2e0"}}>{u.title}</div>{u.url&&<a href={u.url} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#5b9eff",wordBreak:"break-all"}}>{u.url}</a>}</div><button style={s.dangerBtnTiny} onClick={()=>deleteUnlock(br.id,u.id)}>✕</button></div>))}</div>)}
                {locked.length>0&&(<div style={{marginTop:10}}><div style={{fontSize:10,letterSpacing:2,color:"#5c5466",marginBottom:6}}>LOCKED ({locked.length})</div>{locked.slice(0,4).map(u=>(<div key={u.id} style={{...s.unlockItem,opacity:0.4}}><span style={{fontSize:14}}>🔒</span><div style={{flex:1,fontSize:13,color:"#6b6476"}}>???</div><button style={s.dangerBtnTiny} onClick={()=>deleteUnlock(br.id,u.id)}>✕</button></div>))}{locked.length>4&&<div style={{fontSize:11,color:"#4a4454",padding:"4px 8px"}}>+ {locked.length-4} more hidden</div>}</div>)}
                <div style={{display:"flex",gap:8,marginTop:12}}><button style={s.smallBtn} onClick={()=>{setFBranchTarget(br.id);setModal("addUnlock")}}>+ Add Item</button><button style={s.smallBtn} onClick={()=>{setFBranchTarget(br.id);setModal("bulkAdd")}}>+ Bulk Add</button></div>
              </div>)})}
          </div>)}
        <button style={{...s.smallBtn,marginTop:20}} onClick={()=>setModal("addBranch")}>+ Add Branch</button>
      </>)}

      {/* ── RESOURCES TAB ── */}
      {skillTab==="resources"&&(<>
        <div style={{width:"100%",maxWidth:520}}>
          <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
            <button style={{...s.primaryBtn,flex:1}} onClick={()=>{setSmartUploadText("");setSmartItems([]);setModal("smartUpload")}}>📎 Smart Upload</button>
          </div>

          {/* filter tabs */}
          <div style={{display:"flex",gap:4,marginBottom:16,flexWrap:"wrap"}}>
            {[{key:"all",label:"All",count:resources.length},...CATS.map(c=>({key:c,label:CAT_META[c].label,count:resources.filter(r=>r.category===c).length}))].map(f=>(
              <button key={f.key} onClick={()=>setResourceFilter(f.key)} style={{padding:"6px 12px",borderRadius:6,border:"none",fontSize:12,cursor:"pointer",outline:"none",WebkitTapHighlightColor:"transparent",background:resourceFilter===f.key?"rgba(232,93,58,0.2)":"rgba(255,255,255,0.04)",color:resourceFilter===f.key?"#e85d3a":"#6b6476"}}>{f.label} ({f.count})</button>
            ))}
          </div>

          {filteredRes.length===0?(
            <div style={{textAlign:"center",padding:32,color:"#5c5466",fontSize:13}}>{resources.length===0?"No resources yet. Use Smart Upload to add links and they'll be auto-categorized.":"No resources in this category."}</div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {filteredRes.map(r=>{const cm=CAT_META[r.category]||CAT_META.other; const br=activeSkill.branches.find(b=>b.id===r.branchId); return(
                <div key={r.id} style={s.unlockItem}>
                  <span style={{fontSize:14,flexShrink:0}}>{cm.icon}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,color:"#d8d2e0"}}>{r.title}</div>
                    <div style={{display:"flex",gap:8,alignItems:"center",marginTop:2,flexWrap:"wrap"}}>
                      {r.url&&<a href={r.url} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#5b9eff",wordBreak:"break-all"}}>{r.url.length>60?r.url.slice(0,60)+"…":r.url}</a>}
                      <span style={{fontSize:9,padding:"1px 6px",borderRadius:4,background:`${cm.color}18`,color:cm.color}}>{cm.label}</span>
                      {br&&<span style={{fontSize:9,padding:"1px 6px",borderRadius:4,background:"rgba(255,255,255,0.06)",color:"#8a8294"}}>{br.name}</span>}
                    </div>
                  </div>
                  <button style={s.dangerBtnTiny} onClick={()=>deleteResource(r.id)}>✕</button>
                </div>)})}
            </div>
          )}
        </div>
      </>)}

      {/* ══ ALL MODALS ══ */}
      <Modal open={modal==="addBranch"} onClose={()=>setModal(null)} title="Add Branch">
        <div style={s.formGroup}><label style={s.label}>Branch Name</label><input style={s.input} value={fBranchName} onChange={e=>setFBranchName(e.target.value)} placeholder="e.g. Painting, Fingerstyle, Baking"/></div>
        <button style={{...s.primaryBtn,width:"100%"}} onClick={addBranch}>Create Branch</button>
      </Modal>
      <Modal open={modal==="addUnlock"} onClose={()=>setModal(null)} title="Add Unlockable">
        <div style={s.formGroup}><label style={s.label}>Type</label><div style={{display:"flex",gap:8}}>{["tutorial","challenge","reward"].map(t=>(<button key={t} onClick={()=>setFUnlockType(t)} style={{...s.smallBtn,...(fUnlockType===t?{background:"rgba(232,93,58,0.2)",borderColor:"#e85d3a",color:"#e85d3a"}:{})}}>{t==="tutorial"?"📖":t==="challenge"?"⚔️":"🏆"} {t}</button>))}</div></div>
        <div style={s.formGroup}><label style={s.label}>Title</label><input style={s.input} value={fUnlockTitle} onChange={e=>setFUnlockTitle(e.target.value)} placeholder="e.g. Advanced color theory course"/></div>
        <div style={s.formGroup}><label style={s.label}>URL (optional)</label><input style={s.input} value={fUnlockUrl} onChange={e=>setFUnlockUrl(e.target.value)} placeholder="https://..."/></div>
        <div style={s.formGroup}><label style={s.label}>Description (optional)</label><input style={s.input} value={fUnlockDesc} onChange={e=>setFUnlockDesc(e.target.value)} placeholder="Short note"/></div>
        <button style={{...s.primaryBtn,width:"100%"}} onClick={addUnlock}>Add Unlockable</button>
      </Modal>
      <Modal open={modal==="bulkAdd"} onClose={()=>setModal(null)} title="Bulk Add Unlockables">
        <div style={s.formGroup}><label style={s.label}>Type for all</label><div style={{display:"flex",gap:8}}>{["tutorial","challenge","reward"].map(t=>(<button key={t} onClick={()=>setFUnlockType(t)} style={{...s.smallBtn,...(fUnlockType===t?{background:"rgba(232,93,58,0.2)",borderColor:"#e85d3a",color:"#e85d3a"}:{})}}>{t==="tutorial"?"📖":t==="challenge"?"⚔️":"🏆"} {t}</button>))}</div></div>
        <div style={s.formGroup}><label style={s.label}>Paste URLs or titles, one per line</label><textarea style={{...s.input,minHeight:120,fontFamily:"'JetBrains Mono',monospace",fontSize:12}} value={bulkText} onChange={e=>setBulkText(e.target.value)} placeholder={"https://youtube.com/watch?v=abc\nhttps://skillshare.com/class/xyz\nPaint a self-portrait"}/></div>
        <button style={{...s.primaryBtn,width:"100%"}} onClick={bulkAddUnlocks}>Add {bulkText.split("\n").filter(l=>l.trim()).length} Items</button>
      </Modal>
      <Modal open={modal==="logOneOff"} onClose={()=>setModal(null)} title="Log Completed Project">
        <div style={s.formGroup}><label style={s.label}>What did you finish?</label><input style={s.input} value={fProjectName} onChange={e=>setFProjectName(e.target.value)} placeholder="e.g. Oil painting of sunset"/></div>
        <div style={s.formGroup}><label style={s.label}>Which branch?</label><div style={{display:"flex",flexDirection:"column",gap:6}}>{activeSkill.branches.map(br=>(<button key={br.id} onClick={()=>setFProjectBranch(br.id)} style={{...s.smallBtn,width:"100%",textAlign:"left",...(fProjectBranch===br.id?{background:"rgba(232,93,58,0.2)",borderColor:"#e85d3a",color:"#e85d3a"}:{})}}>{br.name}<span style={{float:"right",color:"#5c5466"}}>{br.unlocks.filter(u=>!u.unlocked).length} locked</span></button>))}</div></div>
        <button style={{...s.primaryBtn,width:"100%",fontSize:15,padding:"14px 20px"}} onClick={logOneOff} disabled={!fProjectBranch}>✦ Complete & Unlock</button>
      </Modal>
      <Modal open={modal==="addOngoing"} onClose={()=>setModal(null)} title="New Ongoing Project">
        <div style={s.formGroup}><label style={s.label}>Project Name</label><input style={s.input} value={fOngoingName} onChange={e=>setFOngoingName(e.target.value)} placeholder="e.g. 100 Bass Lessons"/></div>
        <div style={s.formGroup}><label style={s.label}>Which branch?</label><div style={{display:"flex",flexDirection:"column",gap:6}}>{activeSkill.branches.map(br=>(<button key={br.id} onClick={()=>setFOngoingBranch(br.id)} style={{...s.smallBtn,width:"100%",textAlign:"left",...(fOngoingBranch===br.id?{background:"rgba(232,93,58,0.2)",borderColor:"#e85d3a",color:"#e85d3a"}:{})}}>{br.name}</button>))}</div></div>
        <div style={s.formGroup}><label style={s.label}>Target Count</label><input style={s.input} type="number" value={fOngoingTarget} onChange={e=>setFOngoingTarget(e.target.value)} placeholder="e.g. 100"/></div>
        <div style={s.formGroup}><label style={s.label}>Milestones (comma-separated)</label><input style={s.input} value={fOngoingMilestones} onChange={e=>setFOngoingMilestones(e.target.value)} placeholder="e.g. 25, 50, 75, 100"/><div style={{fontSize:11,color:"#5c5466",marginTop:4}}>Each milestone triggers a random unlock</div></div>
        <button style={{...s.primaryBtn,width:"100%"}} onClick={addOngoingProject} disabled={!fOngoingName.trim()||!fOngoingTarget||!fOngoingBranch}>🔄 Create Ongoing Project</button>
      </Modal>

      {/* Discovery Modal */}
      <Modal open={modal==="discover"} onClose={()=>{setModal(null);setDiscoveries([]);setSelectedDiscoveries(new Set())}} title="Discover Related Topics">
        {discovering?(<div style={{textAlign:"center",padding:32}}><div style={{fontSize:24,marginBottom:12}}>🔍</div><div style={{color:"#8a8294",fontSize:13}}>Searching Wikipedia for topics related to <strong style={{color:"#f0e6d3"}}>{activeSkill?.name}</strong>…</div></div>
        ):discoveries.length===0&&modal==="discover"?(<div style={{textAlign:"center",padding:24,color:"#6b6476",fontSize:13}}>No suggestions found. Try adding more branches or URLs.</div>
        ):(<div>
          <div style={{fontSize:12,color:"#8a8294",marginBottom:14,lineHeight:1.5}}>Topics found via Wikipedia based on <strong style={{color:"#f0e6d3"}}>{activeSkill?.name}</strong>{activeSkill?.branches.length>0?" and your branches":""}. Items tagged <span style={{fontSize:9,padding:"1px 5px",borderRadius:3,background:"rgba(91,224,160,0.15)",color:"#5be0a0"}}>SUBTOPIC</span> are key areas within the main article.</div>
          <div style={{maxHeight:360,overflowY:"auto",display:"flex",flexDirection:"column",gap:4}}>
            {discoveries.map(d=>{const sel=selectedDiscoveries.has(d.title);return(
              <div key={d.title} onClick={()=>toggleDiscovery(d.title)} style={{padding:"10px 12px",borderRadius:8,cursor:"pointer",transition:"all 0.15s",background:sel?"rgba(91,158,255,0.15)":"rgba(255,255,255,0.03)",border:`1px solid ${sel?"rgba(91,158,255,0.4)":"rgba(255,255,255,0.06)"}`,display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:20,height:20,borderRadius:4,flexShrink:0,background:sel?"#5b9eff":"rgba(255,255,255,0.06)",border:`1px solid ${sel?"#5b9eff":"rgba(255,255,255,0.15)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"#fff"}}>{sel?"✓":""}</div>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,color:sel?"#d8d2e0":"#a9a1b4",fontWeight:sel?600:400}}>{d.title}{d.fromSection&&<span style={{marginLeft:6,fontSize:9,padding:"2px 6px",borderRadius:4,background:"rgba(91,224,160,0.15)",color:"#5be0a0",fontWeight:700,letterSpacing:1,verticalAlign:"middle"}}>SUBTOPIC</span>}</div><div style={{fontSize:10,color:"#5c5466",marginTop:2}}>via {d.source}</div></div>
                <a href={d.wikiUrl} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:10,color:"#5b9eff",flexShrink:0,textDecoration:"none"}}>wiki ↗</a>
              </div>)})}
          </div>
          {selectedDiscoveries.size>0&&<button style={{...s.primaryBtn,width:"100%",marginTop:16}} onClick={addDiscoveredBranches}>Add {selectedDiscoveries.size} Branch{selectedDiscoveries.size!==1?"es":""}</button>}
        </div>)}
      </Modal>

      {/* Smart Upload Modal */}
      <Modal open={modal==="smartUpload"} onClose={()=>{setModal(null);setSmartItems([]);setSmartUploadText("")}} title="📎 Smart Upload">
        {smartItems.length===0?(
          <div>
            <div style={{fontSize:12,color:"#8a8294",marginBottom:12,lineHeight:1.5}}>Paste links below (one per line). The app will auto-fetch titles, categorize them (Lesson / Supply / Course), and match them to your branches.</div>
            <textarea style={{...s.input,minHeight:160,fontFamily:"'JetBrains Mono',monospace",fontSize:12}} value={smartUploadText} onChange={e=>setSmartUploadText(e.target.value)} placeholder={"https://youtube.com/watch?v=abc123\nhttps://www.amazon.com/dp/B00EXAMPLE\nhttps://udemy.com/course/example"}/>
            <button style={{...s.primaryBtn,width:"100%",marginTop:12}} onClick={runSmartUpload} disabled={processing||!smartUploadText.trim()}>{processing?"Processing…":"Analyze Links"}</button>
          </div>
        ):(
          <div>
            <div style={{fontSize:12,color:"#8a8294",marginBottom:12,lineHeight:1.5}}>Review and adjust. For each link, set the category, branch, and whether it goes to your <strong style={{color:"#f0e6d3"}}>Resource Library</strong> (visible) or <strong style={{color:"#e8a33a"}}>Unlock Pool</strong> (hidden reward).</div>
            <div style={{maxHeight:400,overflowY:"auto",display:"flex",flexDirection:"column",gap:8}}>
              {smartItems.map(it=>{const cm=CAT_META[it.category];return(
                <div key={it.id} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:12}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#e8e4ec",marginBottom:4}}>{it.title}</div>
                  <div style={{fontSize:11,color:"#5b9eff",wordBreak:"break-all",marginBottom:8}}>{it.url}</div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                    {CATS.map(c=>(<button key={c} onClick={()=>updateSmartItem(it.id,"category",c)} style={{padding:"4px 10px",borderRadius:5,border:"none",fontSize:11,cursor:"pointer",outline:"none",background:it.category===c?`${CAT_META[c].color}25`:"rgba(255,255,255,0.04)",color:it.category===c?CAT_META[c].color:"#6b6476"}}>{CAT_META[c].icon} {CAT_META[c].label}</button>))}
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                    {activeSkill.branches.map(br=>(<button key={br.id} onClick={()=>updateSmartItem(it.id,"branchId",it.branchId===br.id?null:br.id)} style={{padding:"4px 10px",borderRadius:5,border:"none",fontSize:11,cursor:"pointer",outline:"none",background:it.branchId===br.id?"rgba(91,224,160,0.15)":"rgba(255,255,255,0.04)",color:it.branchId===br.id?"#5be0a0":"#6b6476"}}>{br.name}</button>))}
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>updateSmartItem(it.id,"destination","resource")} style={{padding:"4px 12px",borderRadius:5,border:"none",fontSize:11,cursor:"pointer",outline:"none",background:it.destination==="resource"?"rgba(91,158,255,0.15)":"rgba(255,255,255,0.04)",color:it.destination==="resource"?"#5b9eff":"#6b6476"}}>📦 Resource</button>
                    <button onClick={()=>updateSmartItem(it.id,"destination","unlock")} style={{padding:"4px 12px",borderRadius:5,border:"none",fontSize:11,cursor:"pointer",outline:"none",background:it.destination==="unlock"?"rgba(232,163,58,0.15)":"rgba(255,255,255,0.04)",color:it.destination==="unlock"?"#e8a33a":"#6b6476",opacity:it.branchId?1:0.4}} disabled={!it.branchId}>🔒 Unlock Pool</button>
                  </div>
                </div>)})}
            </div>
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <button style={{...s.smallBtn,flex:1}} onClick={()=>setSmartItems([])}>← Back</button>
              <button style={{...s.primaryBtn,flex:2}} onClick={commitSmartUpload}>Save {smartItems.length} Links</button>
            </div>
          </div>
        )}
      </Modal>

      <ConfirmModal/>
    </div>)}

  return null;
}

// Error boundary wrapper
function ErrorBoundary({ children }) {
  const [error, setError] = React.useState(null);
  if (error) {
    return React.createElement("div", { style: { padding: 40, textAlign: "center", color: "#e85d3a" } },
      React.createElement("h2", null, "Something went wrong"),
      React.createElement("pre", { style: { color: "#8a8294", marginTop: 12, fontSize: 12, whiteSpace: "pre-wrap" } }, error.toString())
    );
  }
  try {
    return children;
  } catch (e) {
    setError(e);
    return null;
  }
}
